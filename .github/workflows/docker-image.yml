name: Build and publish Docker image

on:
    push:
        branches:
            - main
            - beta
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/animetv

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Lowercase image name
              run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Bump patch version
              if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  npm version patch --no-git-tag-version
                  VERSION=$(node -p "require('./package.json').version")
                  git add package.json
                  git commit -m "chore: bump version to ${VERSION} [skip ci]"
                  git tag "v${VERSION}"
                  git push origin "HEAD:${{ github.ref_name }}"
                  git push origin "v${VERSION}"

            - name: Resolve build metadata
              id: meta_ver
              run: |
                  echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
                  echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
                  if [ "${{ github.ref_name }}" = "main" ]; then
                    echo "channel=stable" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.ref_name }}" = "beta" ]; then
                    echo "channel=beta" >> "$GITHUB_OUTPUT"
                  else
                    echo "channel=development" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: |
                      image=moby/buildkit:latest
                      network=host

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
                      type=raw,value=beta,enable=${{ github.ref_name == 'beta' }}
                      type=sha
                  labels: |
                      org.opencontainers.image.version=${{ steps.meta_ver.outputs.version }}
                      org.opencontainers.image.revision=${{ steps.meta_ver.outputs.sha }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      APP_VERSION=${{ steps.meta_ver.outputs.version }}
                      APP_CHANNEL=${{ steps.meta_ver.outputs.channel }}
                      GIT_SHA=${{ steps.meta_ver.outputs.sha }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
                  provenance: false
                  sbom: false
